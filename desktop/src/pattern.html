<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebRTC Bench screen pattern</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Full-screen latency pattern for screen mirroring (Miracast, Cast, WebRTC display capture).
// Each displayed frame carries its 16-bit frame number in a band across the middle (40-60% of the
// height, clear of the stream overlays at the top and bottom; 16 columns, top row = bits, bottom
// row = inverse); the TV app's screen probe reads it back (ScreenProbeService.kt). Draw times go
// to the bench window over a BroadcastChannel.
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const channel = new BroadcastChannel('wrtcb-pattern');
let n = 0;
function resize() {
  canvas.width = Math.round(innerWidth * devicePixelRatio);
  canvas.height = Math.round(innerHeight * devicePixelRatio);
}
addEventListener('resize', resize);
resize();
function frame(ts) {
  const w = canvas.width;
  const h = canvas.height;
  // Moving content around the band, so encoders see real motion.
  const hue = (n * 3) % 360;
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${hue},60%,35%)`);
  g.addColorStop(1, `hsl(${(hue + 150) % 360},60%,25%)`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#fff';
  const bar = ((n * 9) % 100) / 100;
  ctx.fillRect(bar * w, h * 0.1, w * 0.04, h * 0.25);
  ctx.fillRect(((1 - bar) * w), h * 0.65, w * 0.04, h * 0.2);
  ctx.font = `600 ${Math.round(h * 0.04)}px Consolas, monospace`;
  ctx.fillText(`WebRTC Bench screen latency pattern · frame ${n}`, w * 0.03, h * 0.07);
  const code = n & 0xffff;
  const bw = w / 16;
  for (let i = 0; i < 16; i++) {
    const bit = (code >> (15 - i)) & 1;
    ctx.fillStyle = bit ? '#fff' : '#000';
    ctx.fillRect(Math.floor(i * bw), Math.floor(h * 0.4), Math.ceil(bw), Math.ceil(h * 0.1));
    ctx.fillStyle = bit ? '#000' : '#fff';
    ctx.fillRect(Math.floor(i * bw), Math.floor(h * 0.5), Math.ceil(bw), Math.ceil(h * 0.1));
  }
  channel.postMessage({ n, t: performance.timeOrigin + ts });
  n++;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
